name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version omitted: pnpm/action-setup reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint + typecheck + test
        run: pnpm run check
      - name: Pass hook self-checks (python)
        run: for f in hooks/test_*.py; do python3 "$f"; done
      - name: Plan-check (open items must not ship under a release)
        run: python3 scripts/plan-check.py --release
      - name: "Lesson ledger: unresolved high-risk blocks, learned passes"
        run: python3 scripts/ci-lessons-fixture.py
      - name: "Evidence gate: fixture task must block without proof"
        run: |
          python3 - <<'PY'
          import sys, tempfile, os
          from pathlib import Path
          sys.path.insert(0, "hooks/lib")
          import evidence as ev
          import gate
          with tempfile.TemporaryDirectory() as tmp:
              ev.EVIDENCE_DIR = Path(tmp)
              ev.write_record("current", {"type": "bug", "risk": "high", "obligations": ["regression test"], "evidence": []})
              try:
                  gate.main()
                  raise SystemExit("GATE DID NOT BLOCK — evidence gate broken")
              except SystemExit as e:
                  if e.code != 2:
                      raise SystemExit(f"GATE WRONG EXIT: {e.code}")
          print("evidence gate: correctly blocked high-risk without evidence")
          PY
      - name: "Observe: install to fixture HOME then claude-health"
        run: |
          # Real end-to-end: install into a fake HOME, then health-check the
          # installed state. This catches a release that breaks install/health.
          bash scripts/install.sh
          bash claude-health.sh
        env:
          HOME: /tmp/fh
          CLAUDE_CONFIG_DIR: /tmp/fh/.claude
      - name: Install dry-run (linux)
        run: bash scripts/install.sh --dry-run
        env:
          HOME: /tmp/one-man-fake-home

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version omitted: pnpm/action-setup reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hook self-checks (python)
        run: |
          if (Get-ChildItem hooks/test_*.py) { Get-ChildItem hooks/test_*.py | ForEach-Object { python $_.FullName } }
          python scripts/plan-check.py --release
      - name: Install dry-run (windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/install.ps1 -DryRun
        env:
          HOME: ${{ runner.temp }}\one-man-fake-home
